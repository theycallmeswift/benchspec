# tests/fixtures/judge/unset-judge-env.toml
# Must exit nonzero: $BENCHSPEC_JUDGE_FIXTURE_UNSET_VAR is (by construction) never set
# in the environment this fixture is intended to be run in. Structurally valid at
# collection (env values are strings) — the SchemaError fires lazily, at judge
# EXECUTION time, via benchspec.config.arms.expand_env (the same function arm env uses),
# proving judge env expansion never silently degrades to an empty string.
[tool.benchspec]

[tool.benchspec.judge]
harness = "claude-code"
model = "sonnet"

[tool.benchspec.judge.env]
SOME_JUDGE_KEY = "$BENCHSPEC_JUDGE_FIXTURE_UNSET_VAR"
