# tests/fixtures/sandbox/two-backends.toml
# Accept fixture. Both backends are implemented, so the whole file parses and each set
# resolves to its own backend: `micro` -> microsandbox, `dock` -> docker.
#   benchspec run --set micro --config tests/fixtures/sandbox/two-backends.toml
#   benchspec run --set dock  --config tests/fixtures/sandbox/two-backends.toml
# Selecting `dock` reaches the Docker host preflight, which the end-to-end tests point at
# a nonexistent binary through BENCHSPEC_DOCKER_PATH so no test touches a real daemon.
[tool.benchspec]
default-set = "micro"

[tool.benchspec.sets.micro]
model = "sonnet"
sandbox = "microsandbox"
baseline = "baseline"
arms = [{ name = "baseline", harness = "claude-code" }]

[tool.benchspec.sets.dock]
model = "sonnet"
sandbox = "docker"
baseline = "baseline"
arms = [{ name = "baseline", harness = "claude-code" }]
