# Labeled corpus for the binder false-positive gate (`make evals:binder`).
# Grouped by the binder's correct action; every entry is the assertion text verbatim.
# A bind sub-key is the expected checker; a punt sub-key is the punt class. gold,
# cohort, and expect_checker are positional — the gate reconstructs them on load.

# binds — gold:bind. Sub-key is the checker each assertion should bind to.
binds:
  skill_invoked:
  - Skill `archive` invoked
  - Skill `bootstrap` invoked
  - Skill `export-agent-session` invoked
  - Skill `handoff` invoked
  - Skill `ingest` invoked
  - Skill `interview-me` invoked
  - Skill `to-spec` invoked
  - Skill `writing-agent-skills` invoked
  glob_count:
  - All three are flat markdown files under ./9. Archive/Sources/{TODAY}/ (rust-async.md, wasm-components.md,
    edge-databases.md), not wrapped in per-source subfolders
  - Both files from the folder are present together at ./9. Archive/Sources/{TODAY}/pycon-keynote/
    (index.md and the image alongside it)
  - No file named .gitkeep exists anywhere under ./
  - No file was written to disk — the handoff exists only as the emitted message
  - Both Inbox captures were archived as separate flat files (gpt5-techcrunch.md and gpt5-openai-blog.md)
    under './9. Archive/Sources/{TODAY}/'
  - No `docs/specs/` directory was created and no spec file was written during the session — the
    handoff is in-conversation only.
  - A spec file was written at './docs/specs/{TODAY}-<slug>.md' — the filename is today's date
    plus a kebab-case slug derived from the title, with NO '-design' suffix
  - No spec file was written under './docs/specs/' — the context is too thin to ground a spec,
    so the skill did not emit a confident hollow one
  - Exactly one spec file exists under './docs/specs/'
  - No spec file under './docs/specs/' carries a '-design' suffix
  # decomposed child of the six-template-files compound punts below (the
  # `./.meta/templates/ contains all six template files named exactly: …` line and its
  # "previously-missing" restatement under semantic): the flat lines punt, this count binds.
  - text: Exactly six files match ./.meta/templates/*.md
    expect:
      glob: ./.meta/templates/*.md
      count: 6
  # decomposed child of the dated-log-file compound punt below (the `A dated log file
  # named YYYY-MM-DD.md exists … and contains a header …` line under semantic): the
  # flat line punts, this count check binds.
  - text: At least one file matches ./.meta/logs/*.md
    expect:
      glob: ./.meta/logs/*.md
      min: 1
  # decomposed child of the full-skim-first-spec compound punt below (the `A spec file
  # was written at './docs/specs/{TODAY}-<slug>.md' with the full skim-first section
  # set` line under semantic): the flat line punts, this count check binds — not a
  # duplicate of the spec-path counts above, which decompose a different punt.
  - text: At least one file matches './docs/specs/{TODAY}-*.md'
    expect:
      glob: ./docs/specs/{TODAY}-*.md
      min: 1
  file_exists:
  - The folder no longer exists at ./0. Inbox/pycon-keynote/ — it was moved out of the Inbox
  - The capture now lives at ./9. Archive/Sources/{TODAY}/openai-o1-launch.md — a flat markdown
    file under a dated Sources folder (NOT a per-source subfolder, NOT renamed to index.md)
  - The previously-missing ./.obsidian/ configuration now exists
  # decomposed children of the seven-PARA-directories compound punt below (the
  # `./ contains all seven numbered PARA directories: …` line under semantic):
  # the flat line punts, these atomic single-directory checks bind.
  - The 0. Inbox/ directory exists under ./
  - The 1. Profile/ directory exists under ./
  - The 2. Entities/ directory exists under ./
  - The 3. Projects/ directory exists under ./
  - The 4. Areas/ directory exists under ./
  - The 5. Resources/ directory exists under ./
  # seventh atom: the nested `9. Archive/Sources/` from the flat punt, as a directory check
  - The 9. Archive/Sources/ directory exists under ./
  # the "previously-missing PARA folders now all exist: …" compound punt below reuses
  # five of these directory children — no new entries needed.
  # file_exists child of the index.md compound punt below (the
  # `./.meta/index.md exists, opens with a '# Index' heading, …` line under
  # semantic): the flat line punts, this atomic existence check binds.
  - ./.meta/index.md exists
  - text: ./.meta/templates/entity-person.md exists
    expect:
      path: ./.meta/templates/entity-person.md
  # file_exists children of the ./.meta/-contents compound punt below (the `./.meta/
  # exists and contains index.md, logs/, templates/` line under semantic): the flat
  # line punts, these directory checks bind; index.md's child is the entry above.
  - The ./.meta/logs/ directory exists
  - The ./.meta/templates/ directory exists
  # file_exists child of the whoami frontmatter compound punt below (the `./1. Profile/
  # whoami.md exists and its frontmatter … ISO 8601 …` line under semantic): the flat
  # line punts — its ISO-format half stays judge territory — this existence check binds.
  - ./1. Profile/whoami.md exists
  regex:
  - ./.meta/index.md now exists with a '# Index' heading
  # the two regex children of the index.md compound punt: phrased so the
  # line-content (regex) intent is unmistakable, distinct from file_exists.
  - the first line of ./.meta/index.md matches '# Index'
  - ./.meta/index.md has a line beginning '_Last updated'
  - text: ./.meta/templates/entity-person.md has a line beginning 'aliases:'
    expect:
      path: ./.meta/templates/entity-person.md
  # regex child of the same dated-log-file compound punt (see the glob_count child
  # above): the flat line punts, this line-content check binds.
  - text: ./.meta/logs/{TODAY}.md has a line containing 'bootstrap | '
    expect:
      path: ./.meta/logs/{TODAY}.md
  # decomposed regex child of the spec-H2-sections compound punt below (the `The spec
  # opens with a one-line TL;DR and contains all of these H2 sections: …` line under
  # semantic): the full section SET punts, this single-section check binds.
  - text: ./docs/specs/{TODAY}-<slug>.md has a line matching '## Problem'
    expect:
      path: ./docs/specs/{TODAY}-<slug>.md
  frontmatter_has:
  # key-presence child of the same whoami frontmatter compound punt (see its
  # file_exists child above): the flat line punts, this key check binds.
  - text: ./1. Profile/whoami.md frontmatter has a 'created' key
    expect:
      path: ./1. Profile/whoami.md
      key: created
  # decomposed child of the six-template-files-frontmatter compound punt below (the
  # `Each of the six template files begins with YAML frontmatter declaring at least
  # the keys …` line under semantic): all-six-files-all-five-keys punts, this
  # single-file single-key demonstrator binds.
  - text: ./.meta/templates/entity-person.md frontmatter has a 'title' key
    expect:
      path: ./.meta/templates/entity-person.md
      key: title

# punts — gold:punt. The binder must defer to the judge.
punts:
  # presence / persistence / negation — the documented leak; the binder is blind to
  # the invisible "…and was not altered/replaced" clause these carry. Heavy-sampled.
  persistence:
  - No new 'archive' entry for meeting-notes was written to ./.meta/logs/{TODAY}.md (a refused
    move is not logged)
  - The day's log ./.meta/logs/{TODAY}.md still contains its original earlier entry verbatim AND
    additionally contains a new '## [<ISO datetime>] archive | <title>' entry appended after it
  - No duplicate or backup of the profile page was created (no whoami.md.bak, no 'whoami (1).md',
    no second whoami file anywhere under ./)
  - The pre-existing entity page './2. Entities/anthropic.md' was updated in place — still a single
    file (not duplicated, not a second anthropic page) — and now reflects that Anthropic created
    MCP
  - The archived copy preserves the article's substantive body content (re-frontmattering on archive
    did not discard the post's text)
  - The pre-existing claim on './5. Resources/reasoning-models.md' that chain-of-thought requires
    at least 100 billion parameters is still present and visible — it was not deleted or silently
    replaced by the new 7B/distillation finding
  - '''./.meta/index.md'' was regenerated and still lists the reasoning-models page (with its
    one-line summary) under a Resources section'
  # compound / intent claims the judge must grade. Two of these are paired
  # decomposition demonstrators: the flat compound line STAYS a punt here (a
  # compound single line must defer at the binder layer), while its atomic
  # children belong as gold:bind entries under file_exists / regex. The pairing
  # documents the contract "flat punts, sub-bullets determinize".
  semantic:
  - The activity log at ./.meta/logs/{TODAY}.md records all three under a SINGLE archive entry
    (one '## [<ISO datetime>] archive | <title>' header), not three separate archive entries
  - That single archive entry has a separate 'source:' line for each of the three files, naming
    both the Inbox source and the archived destination
  - The agent's final message states that the destination already exists / the archive could not
    proceed because of the collision — it does not claim the file was archived successfully
  - The new log entry has a 'source:' line naming the move of the 'pycon-keynote' folder into
    its archived destination
  - The activity log ./.meta/logs/{TODAY}.md has a 'source:' line under the archive entry that
    names both the Inbox source path '0. Inbox/openai-o1-launch.md' and the archived destination
    path
  - No archive category folder other than 'Sources' was created under ./9. Archive/
  - './ contains all seven numbered PARA directories: ''0. Inbox/'', ''1. Profile/'', ''2. Entities/'',
    ''3. Projects/'', ''4. Areas/'', ''5. Resources/'', and ''9. Archive/Sources/'''
  - ./.meta/ exists and contains index.md (a file), logs/ (a directory), and templates/ (a directory)
  - './.meta/templates/ contains all six template files named exactly: entity-person.md, entity-org.md,
    resource.md, project-index.md, area-index.md, profile-detail.md'
  - Each of the six template files begins with YAML frontmatter declaring at least the keys title,
    aliases, tags, created, and updated
  - ./1. Profile/whoami.md exists and its frontmatter created and updated fields are concrete
    ISO 8601 datetimes with a timezone offset (e.g. 2026-05-23T14:03:00-04:00), not unfilled template
    placeholders such as {{date}} or {{time}}
  - ./.meta/index.md exists, opens with a '# Index' heading, and contains a line beginning '_Last
    updated'
  - ./.obsidian/ exists and its configuration enables the core Templates plugin pointed at the
    .meta/templates folder AND excludes '9. Archive/' from search
  - A dated log file named YYYY-MM-DD.md exists under ./.meta/logs/ and contains a header of the
    form '## [<ISO datetime>] bootstrap | <title>'
  - The previously-missing ./.meta/templates/ now exists and contains all six template files
  - 'The previously-missing PARA folders now all exist: ''2. Entities/'', ''3. Projects/'', ''4.
    Areas/'', ''5. Resources/'', and ''9. Archive/Sources/'''
  - The agent's final message states that the target path is an existing file (or otherwise an
    unusable vault root) and that bootstrap did not proceed — it does not claim the vault was
    created successfully
  - No vault scaffolding (e.g. a '0. Inbox/' folder or a '.meta/' tree) was created under your
    current working directory or any other fallback location the agent chose on its own
  - The output is a single copyable message with `## Files` and `## Context & goal` H2 sections
    — no file written to disk
  - '`./docs/style/writing-tests.md` is the file actively being edited, so it is named in the
    `## Context & goal` PROSE as the in-flight deliverable, NOT `@`-listed in `## Files` — the
    skill resolves the ambiguity by edit-status, not by "it''s a doc"'
  - The `## Files` `@`-list carries the durable background the next session won't recall on its
    own (e.g. `./docs/plans/2026-06-01-test-style.md`) and does not collapse to listing the in-flight
    doc
  - The open question (fixture-naming section) is preserved in `## Context & goal`
  - The output is a single copyable markdown message with exactly two H2 sections, `## Files`
    and `## Context & goal` — NOT a file written to disk
  - 'The `## Files` section lists `@`-prefixed paths and includes the background the next session
    would not find itself: the plan (`./docs/plans/2026-06-01-rate-limit.md`), the style doc (`./docs/style/writing-code.md`),
    and the spec (`./docs/specs/2026-06-01-rate-limit.md`)'
  - The `## Files` section does NOT `@`-list the in-flight edit targets `./src/api/middleware.py`
    / `./src/api/config.py`, nor the test file `./tests/api/test_middleware.py` (the edit targets
    belong in prose; the test is trivially discoverable). The Redis client / settings loader are
    a judgment call — not asserted either way here.
  - The in-flight / edit-target files (`./src/api/middleware.py`, `./src/api/config.py`) are named
    in the `## Context & goal` PROSE, not as `@`-paths in `## Files`
  - The `## Context & goal` section preserves the locked decisions (100/150 limits, Redis counters,
    429 + Retry-After) and the open question (region sharding), and is shaped by the focus hint
    (finish wiring the 429 response)
  - The skill does NOT invent or `@`-list background docs that were never mentioned (no fabricated
    plan/spec/style paths); `## Files` is either empty/omitted or contains only what the session
    actually referenced
  - The in-flight file `./src/config.py` is named in `## Context & goal` prose, not `@`-listed
  - With an empty focus hint, `## Context & goal` captures the natural continuation (perform/verify
    the `foo` → `parse_config` rename) rather than stalling or asking the user a question
  - A new Resource page about the Model Context Protocol was created under './5. Resources/' (e.g.
    model-context-protocol.md), with YAML frontmatter that includes a title, a one-line summary:,
    and created and updated datetimes
  - The new Resource's body reflects facts from the source — it describes MCP as an open protocol
    with a client-server architecture and names the three server primitives (tools, resources,
