  - '''./.meta/index.md'' was regenerated: it carries a ''_Last updated'' stamp, an Entities section
    listing Anthropic, and a Resources section whose line for the new MCP page is that page''s
    one-line summary'
  - 'The source now lives as a flat file ''./9. Archive/Sources/{TODAY}/<slug>.md'' with frontmatter
    carrying tags: [archived-source] and the original source_url'
  - 'Today''s activity log ''./.meta/logs/{TODAY}.md'' contains an ''## [<ISO datetime>] ingest
    | <title>'' entry whose body has source:, created:, updated:, and index sections: bullets'
  - The reasoning-models page now contains a visible Contested callout (or a clearly-labeled contradiction
    note) that presents BOTH the 100B-scale claim and the new 7B/distillation finding
  - The page's '## Sources' block now carries footnote definitions for BOTH the original cot-prompting
    archived source AND the newly-archived small-model-reasoning source, with inline footnote
    markers in the body next to the relevant claims
  - 'The new Inbox capture was archived: the source now lives as a flat file ''./9. Archive/Sources/{TODAY}/<slug>.md''
    with tags: [archived-source] frontmatter'
  - 'Today''s log ''./.meta/logs/{TODAY}.md'' has an ingest entry whose updated: field names the
    reasoning-models page and whose source: references the newly-archived source'
  - The agent's final summary states that the new source contradicts the existing reasoning-models
    page and that the conflict was flagged/contested rather than resolved by overwriting the old
    claim
  - Exactly one new Resource page about GPT-5 was created under './5. Resources/' — the group
    was synthesized into a single coherent page, not one page per source
  - The GPT-5 page ends with a '## Sources' block whose footnote definitions cover BOTH archived
    captures (the TechCrunch and the OpenAI-blog sources), not just one of them
  - 'The page surfaces the context-window contradiction: both the 256,000-token and the 1,000,000-token
    figures appear (or a visible Contested/disagreement note citing both sources), rather than
    the page silently stating a single context-window number'
  - '''./.meta/index.md'' was regenerated with a Resources line for the new GPT-5 page (its text
    being that page''s one-line summary) alongside the pre-existing OpenAI entity line'
  - 'Today''s log ''./.meta/logs/{TODAY}.md'' has a single ingest entry whose source: field references
    both archived sources and whose created: field names the new GPT-5 page'
  - The agent's final summary names the context-window disagreement between the two sources and
    marks it as something the user should review — it does not resolve it silently or omit mention
    of it
  - The first turn poses exactly ONE question, and it is about the STOP CONDITION — where the
    interview should stop (until the user says stop / until a downstream skill like to-spec has
    enough / until a stated goal is met) — not a substantive design question about the onboarding
    flow.
  - The skill does NOT begin substantive design grilling (it asks no onboarding-design questions
    and presents no design options) before the stop mode is resolved.
  - 'process: No handoff requirements subagent is dispatched yet — with no stop mode chosen there
    is no named target to read a `SKILL.md` for.'
  - With the stop mode now resolved to manual, the skill begins the interview — it asks ONE substantive
    onboarding-design question, presented WITH a visual (inline ASCII/table or an `AskUserQuestion`
    preview).
  - 'process: In the first turn, before grilling the design, the skill dispatched a subagent (an
    Agent/Task call) — the mode-B requirement-discovery step that reads the handoff target''s
    `SKILL.md`. (The manual-mode eval, by contrast, dispatches no such subagent, so this call
    is what distinguishes handoff from manual.)'
  - The turn poses exactly ONE question (one unresolved decision), not a batch of several questions
    bundled together.
  - The question is presented WITH a visual — an inline ASCII diagram or table, or an `AskUserQuestion`-style
    option preview — rather than bare-text prose options.
  - The turn poses exactly ONE follow-up question and does not re-ask anything already settled
    (the limit, the burst, or the storage choice).
  - This decision turn also ships a visual (inline ASCII/table or an `AskUserQuestion` preview),
    not bare-text options.
  - At stop the skill emits a "Shared Understanding" synthesis block that covers what's decided,
    the key facts, the non-goals, and any open questions (the exact headings may vary, but all
    four of those buckets are present).
  - The skill ANNOUNCES that it is ready to hand off to `to-spec` and HALTS — it states handoff
    readiness rather than continuing to grill.
  - 'process: The skill did NOT invoke the `to-spec` skill — no Skill or Task call that runs to-spec,
    and no spec file written. It announces handoff readiness only.'
  - 'process: The skill did NOT dispatch a subagent to read `to-spec` (or any other skill''s `SKILL.md`)
    for a requirements checklist — mode A has no downstream handoff target, so the requirement-discovery
    step does not run. (This is what distinguishes mode A from mode B.)'
  - The turn poses exactly ONE question, presented WITH a visual (inline ASCII/table or an `AskUserQuestion`
    preview), not bare-text options.
  - The skill keeps the interview open — it does not announce that it is done or hand off, because
    the user has not said stop.
  - The turn poses exactly ONE follow-up question, again with a visual, and does not declare the
    interview finished — the user still has not said stop.
  - Now that the user has said stop, the skill halts and emits a final "Shared Understanding"
    synthesis block covering decided / key facts / non-goals / open questions.
  - The skill stops at the user's command and does not keep asking new design questions after
    the explicit stop.
  - 'The spec opens with a one-line TL;DR and contains all of these H2 sections: Problem, Solution,
    User Stories, Implementation Decisions, Testing Plan, Documentation Plan, Out of Scope, References,
    Verification'
  - The Problem section uses labeled bullets (e.g. Symptom / Constraint), not multi-sentence paragraphs
  - The Solution section leads with a short copy-pasteable artifact (a code/config snippet) followed
    by no more than two sentences of prose
  - Implementation Decisions contains a flow diagram whose nodes map to real symbols/paths from
    the repo (e.g. `./service/reads.py` read_widget, `./service/writes.py` write_widget)
  - The Testing Plan is a coverage contract grouped under derived surfaces named Logic / Behavior
    / Interface — each entry states an observable guarantee, with NO test function names, file
    paths, or case counts, and NO runnable commands (commands live under Verification)
  - The spec states that the assumed 30-second cache TTL does NOT exist in `./service/reads.py`
    (the file has no TTL constant and no caching), rather than repeating the assumption as fact
    or omitting any mention of it — the perishable-fact grounding the skill must do against the
    live tree
  - The unresolved cache-size question appears under a '## Open Questions' section, not asserted
    as a settled decision in Problem/Solution/Implementation Decisions
  - References and Verification are both present and non-empty; Verification lists runnable done-criteria
    commands
  - The final message reports specifically what is missing to write a spec (e.g. a concrete problem,
    a proposed change, constraints) and hands the decision back to the user
  - The skill does NOT fabricate a problem statement, user stories, or implementation decisions
    to fill the gap, and does NOT silently redirect to a different skill
  - A spec file was written at './docs/specs/{TODAY}-<slug>.md' with the full skim-first section
    set
  - The two unresolved decisions (whether to log request bodies, and which log sink) appear under
    '## Open Questions' — phrased as open, not resolved
  - The Problem/Solution/Implementation Decisions sections do NOT invent a confident answer to
    either open decision (e.g. they do not assert a specific log sink as chosen)
  - The settled parts (logging method/path/status/latency for the request lifecycle in `./app/server.py`)
