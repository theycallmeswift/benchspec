[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "benchspec"
dynamic = ["version"]
description = "benchspec is a framework for evaluating AI agents with repeatable, isolated benchmarks. Write evals as Markdown, run each eval across named benchmark arms, and compare how agent behavior changes by harness, model, effort, and environment."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Swift", email = "swift@majorleaguehacking.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pytest",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pytest>=8",
    "python-dotenv>=1.0",
    "pyyaml>=6",
]

[project.optional-dependencies]
# Agent CLIs install out-of-band; extras document supported integrations.
claude = []
codex = []
opencode = []
microsandbox = ["microsandbox>=0.6.16,<0.7"]
testing = []

[dependency-groups]
dev = [
    "houserules>=0.1.1,<1.0.0",
    "pytest>=8",
    "pytest-xdist>=3",
    "pytest-repeat>=0.9,<1",
    "ruff>=0.16",
    "microsandbox>=0.6.16,<0.7",
    "ty>=0.0.79,<0.1",
]

[project.urls]
Homepage = "https://github.com/theycallmeswift/benchspec"
Documentation = "https://github.com/theycallmeswift/benchspec/tree/dev/docs"
Issues = "https://github.com/theycallmeswift/benchspec/issues"

[project.scripts]
benchspec = "benchspec.__main__:main"

[project.entry-points.pytest11]
benchspec = "benchspec.runners.pytest"

[tool.hatch.version]
path = "src/benchspec/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/benchspec"]

[tool.hatch.build.targets.sdist]
# Ship what a downstream builder needs: the package, its tests and the fixtures they
# read, and the user docs. Planning records, agent config, the lockfile, and CI stay
# in the repository.
include = [
    "src/benchspec",
    "tests",
    "evals",
    "docs/*.md",
    "docs/style",
    "Makefile",
    # Anchored: an unanchored `README.md` matches at any depth, so a README anywhere
    # under docs/ would ship too.
    "/README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors: syntax-adjacent readability and whitespace.
    "F",      # Pyflakes: undefined names, unused imports, and invalid constructs.
    "I",      # isort: stdlib, third-party, local import grouping and ordering.
    "UP",     # pyupgrade: modern Python syntax for the supported version range.
    "FA",     # flake8-future-annotations: require postponed annotations.
    "D",      # pydocstyle: module, class, and function docstring requirements.
    "ANN",    # flake8-annotations: function argument and return annotations.
    "TID",    # flake8-tidy-imports: absolute imports and banned import shapes.
    "PT",     # flake8-pytest-style: pytest-specific readability rules.
    "B",      # flake8-bugbear: likely bugs and surprising Python behavior.
    "A",      # flake8-builtins: avoid shadowing Python builtins.
    "RUF100", # Ruff: remove stale noqa suppressions while houserules bans suppressions.
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.src]
# The brand-asset script declares its own PEP 723 dependencies (pillow), which never
# install into the project venv; ty checks it only when it is named on the command line.
exclude-scripts = true

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
markers = [
    "binder_corpus: live Gemini binder corpus eval (costs money; run via `make evals`)",
    "benchspec: skill-eval cases run via `benchspec run` or `make e2e` (declared here too so importing benchspec.orchestration.cases in the unit suite, where the plugin isn't loaded, stays warning-free)",
]
addopts = "-m 'not binder_corpus'"

[tool.benchspec]
default-set = "e2e"
eval_paths = ["evals"]

[tool.benchspec.sets.e2e]
harness  = "claude-code"
model    = "sonnet"
effort   = "medium"
baseline = "baseline"
env = { GREETING_STYLE = "formal", GREETING_LOCALE = "en-US" }
arms = [
  { name = "baseline" },                                                   # installs no skill
  { name = "trial" },                                                      # installs the skill, set defaults
  { name = "trial-overrides", model = "opus", effort = "high", env = { GREETING_LOCALE = "en-GB" } },
]

# The same hello suite with the binder, the judge, and every harness on OpenRouter, so
# `make e2e` covers the single-key path too. Arms stay on Anthropic and OpenAI models;
# `make e2e` puts the Codex judge on a Google slug so it grades cross-family.
[tool.benchspec.sets.e2e-openrouter]
harness  = "claude-code"
provider = "openrouter"
model    = "anthropic/claude-sonnet-4.6"
effort   = "medium"
baseline = "baseline"
env = { GREETING_STYLE = "formal", GREETING_LOCALE = "en-US" }
arms = [
  { name = "baseline" },                                                              # installs no skill
  { name = "trial" },                                                                 # installs the skill, set defaults
  { name = "trial-codex", harness = "codex", model = "openai/gpt-5.5" },
  { name = "trial-opencode", harness = "opencode", model = "openrouter/anthropic/claude-sonnet-4.6" },
]

# Placebo experiment: the stub skill carries the real name and description with a noop
# body, so trial vs placebo isolates the skill's content from its mere presence.
[tool.benchspec.sets.e2e-placebo]
harness  = "claude-code"
provider = "openrouter"
model    = "anthropic/claude-sonnet-4.6"
effort   = "medium"
baseline = "baseline"
env = { GREETING_STYLE = "formal", GREETING_LOCALE = "en-US" }
arms = [
  { name = "baseline" },  # installs no skill
  { name = "placebo" },   # installs the noop stub
  { name = "trial" },     # installs the skill
]

# The placebo experiment on the other two harnesses, to check whether either fails to load
# skills. Only one arm can be the baseline, so baseline-opencode's trigger line is graded.
[tool.benchspec.sets.e2e-placebo-harness]
provider = "openrouter"
effort   = "medium"
baseline = "baseline-codex"
env = { GREETING_STYLE = "formal", GREETING_LOCALE = "en-US" }
arms = [
  { name = "baseline-codex",    harness = "codex",    model = "openai/gpt-5.5" },
  { name = "placebo-codex",     harness = "codex",    model = "openai/gpt-5.5" },
  { name = "trial-codex",       harness = "codex",    model = "openai/gpt-5.5" },
  { name = "baseline-opencode", harness = "opencode", model = "openrouter/anthropic/claude-sonnet-4.6" },
  { name = "placebo-opencode",  harness = "opencode", model = "openrouter/anthropic/claude-sonnet-4.6" },
  { name = "trial-opencode",    harness = "opencode", model = "openrouter/anthropic/claude-sonnet-4.6" },
]

# Placebo experiment on older and smaller models: does the stub still fire like the skill?
# Run with -k "not writes-greeting-file" (that eval has no trigger line).
[tool.benchspec.sets.e2e-placebo-weak]
provider = "openrouter"
effort   = "medium"
timeout  = 180
env = { GREETING_STYLE = "formal", GREETING_LOCALE = "en-US" }
arms = [
  { name = "placebo-haiku3", harness = "claude-code", model = "anthropic/claude-3-haiku" },
  { name = "trial-haiku3", harness = "claude-code", model = "anthropic/claude-3-haiku" },
  { name = "placebo-haiku45", harness = "claude-code", model = "anthropic/claude-haiku-4.5" },
  { name = "trial-haiku45", harness = "claude-code", model = "anthropic/claude-haiku-4.5" },
  { name = "placebo-sonnet4", harness = "claude-code", model = "anthropic/claude-sonnet-4" },
  { name = "trial-sonnet4", harness = "claude-code", model = "anthropic/claude-sonnet-4" },
  { name = "placebo-gpt35", harness = "opencode", model = "openrouter/openai/gpt-3.5-turbo" },
  { name = "trial-gpt35", harness = "opencode", model = "openrouter/openai/gpt-3.5-turbo" },
  { name = "placebo-gpt4omini", harness = "opencode", model = "openrouter/openai/gpt-4o-mini" },
  { name = "trial-gpt4omini", harness = "opencode", model = "openrouter/openai/gpt-4o-mini" },
  { name = "placebo-llama8b", harness = "opencode", model = "openrouter/meta-llama/llama-3.1-8b-instruct" },
  { name = "trial-llama8b", harness = "opencode", model = "openrouter/meta-llama/llama-3.1-8b-instruct" },
  { name = "placebo-ministral8b", harness = "opencode", model = "openrouter/mistralai/ministral-8b-2512" },
  { name = "trial-ministral8b", harness = "opencode", model = "openrouter/mistralai/ministral-8b-2512" },
  { name = "placebo-gpt41nano", harness = "codex", model = "openai/gpt-4.1-nano" },
  { name = "trial-gpt41nano", harness = "codex", model = "openai/gpt-4.1-nano" },
]

[tool.benchspec.judge]
harness = "codex"
model   = "gpt-5.5"
