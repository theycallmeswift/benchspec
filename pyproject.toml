[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evalspec"
dynamic = ["version"]
description = "A pytest-native runner for coding-agent skill evals, sandboxed under microsandbox."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Swift", email = "swift@majorleaguehacking.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pytest",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pytest>=8",
    "python-dotenv>=1.0",
    "pyyaml>=6",
]

[project.optional-dependencies]
# Agent CLIs install out-of-band; extras document supported integrations.
claude = []
codex = []
opencode = []
microsandbox = ["microsandbox>=0.6.6,<0.7"]
testing = []

[dependency-groups]
dev = [
    "houserules>=0.1.1,<1.0.0",
    "pytest>=8",
    "pytest-xdist>=3",
    "pytest-repeat>=0.9,<1",
    "ruff>=0.6",
    "microsandbox>=0.6.6,<0.7",
]

[project.urls]
Homepage = "https://github.com/theycallmeswift/evalspec"
Documentation = "https://github.com/theycallmeswift/evalspec/tree/dev/docs"
Issues = "https://github.com/theycallmeswift/evalspec/issues"

[project.scripts]
evalspec = "evalspec.__main__:main"

[project.entry-points.pytest11]
evalspec = "evalspec.plugin"

[tool.hatch.version]
path = "src/evalspec/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/evalspec"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors: syntax-adjacent readability and whitespace.
    "F",      # Pyflakes: undefined names, unused imports, and invalid constructs.
    "I",      # isort: stdlib, third-party, local import grouping and ordering.
    "UP",     # pyupgrade: modern Python syntax for the supported version range.
    "FA",     # flake8-future-annotations: require postponed annotations.
    "D",      # pydocstyle: module, class, and function docstring requirements.
    "ANN",    # flake8-annotations: function argument and return annotations.
    "TID",    # flake8-tidy-imports: absolute imports and banned import shapes.
    "PT",     # flake8-pytest-style: pytest-specific readability rules.
    "B",      # flake8-bugbear: likely bugs and surprising Python behavior.
    "A",      # flake8-builtins: avoid shadowing Python builtins.
    "RUF100", # Ruff: remove stale noqa suppressions while houserules bans suppressions.
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
markers = [
    "binder_corpus: live Gemini binder corpus eval (costs money; run via `make evals`)",
    "evalspec: skill-eval cases run via `evalspec run` or `make e2e` (declared here too so importing evalspec.orchestration.cases in the unit suite, where the plugin isn't loaded, stays warning-free)",
]
addopts = "-m 'not binder_corpus'"

[tool.evalspec]
default-set = "e2e"
eval_paths = ["evals"]

[tool.evalspec.sets.e2e]
harness  = "claude-code"
model    = "sonnet"
effort   = "medium"
baseline = "baseline"
env = { GREETING_STYLE = "formal", GREETING_LOCALE = "en-US" }
arms = [
  { name = "baseline" },                                                   # installs no skill
  { name = "trial" },                                                      # installs the skill, set defaults
  { name = "trial-overrides", model = "opus", effort = "high", env = { GREETING_LOCALE = "en-GB" } },
]

[tool.evalspec.judge]
harness = "codex"
model   = "gpt-5.5"
